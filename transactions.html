<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>ROLEX — Transactions</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #03140a;
      --bg-2: #051e10;
      --card: #082716;
      --card-hover: #0b321d;

      --gold: #d4a317;
      --gold-light: #f0c94f;

      --green: #10b981;
      --green-light: #34d399;

      --white: #ffffff;
      --text: #eaf5ee;
      --muted: #8fa99a;

      --border: rgba(212, 163, 23, .20);
      --border-light: rgba(255, 255, 255, .07);

      --danger: #ef4444;
      --warning: #f59e0b;

      --shadow: 0 18px 45px rgba(0, 0, 0, .25);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      min-height: 100vh;

      font-family: "Inter", sans-serif;

      color: var(--text);

      background:
        radial-gradient(
          circle at top right,
          rgba(16, 185, 129, .08),
          transparent 28%
        ),
        radial-gradient(
          circle at bottom left,
          rgba(212, 163, 23, .05),
          transparent 30%
        ),
        var(--bg);
    }

    button,
    input {
      font-family: inherit;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    /* =========================
       TOPBAR
    ========================= */

    .topbar {
      height: 72px;

      position: sticky;
      top: 0;
      z-index: 100;

      display: flex;
      align-items: center;
      justify-content: space-between;

      padding: 0 28px;

      background: rgba(3, 20, 10, .95);

      backdrop-filter: blur(16px);

      border-bottom: 1px solid var(--border);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-logo {
      width: 42px;
      height: 42px;

      object-fit: cover;

      border-radius: 11px;

      border: 1px solid rgba(212, 163, 23, .45);

      box-shadow:
        0 8px 25px rgba(0, 0, 0, .25);
    }

    .brand-name {
      color: var(--gold-light);

      font-size: 20px;
      font-weight: 800;

      letter-spacing: 1.5px;
    }

    .back-btn {
      width: 42px;
      height: 42px;

      display: flex;
      align-items: center;
      justify-content: center;

      border-radius: 11px;

      border: 1px solid var(--border);

      background: rgba(8, 39, 22, .85);

      color: var(--text);

      font-size: 21px;

      cursor: pointer;

      transition: .2s ease;
    }

    .back-btn:hover {
      color: var(--gold-light);

      border-color: var(--gold);

      transform: translateX(-2px);
    }

    /* =========================
       CONTAINER
    ========================= */

    .container {
      width: min(950px, calc(100% - 30px));

      margin: 0 auto;

      padding: 38px 0 70px;
    }

    .page-heading {
      margin-bottom: 26px;
    }

    .eyebrow {
      margin-bottom: 8px;

      color: var(--gold);

      font-size: 11px;
      font-weight: 800;

      letter-spacing: 2px;

      text-transform: uppercase;
    }

    .page-heading h1 {
      font-size: clamp(27px, 5vw, 36px);

      font-weight: 800;

      letter-spacing: -.8px;
    }

    .page-heading p {
      margin-top: 8px;

      color: var(--muted);

      font-size: 14px;

      line-height: 1.5;
    }

    /* =========================
       HEADER
    ========================= */

    .transactions-header {
      display: flex;

      align-items: center;
      justify-content: space-between;

      gap: 15px;

      margin-bottom: 18px;

      padding: 17px 18px;

      border-radius: 15px;

      background:
        linear-gradient(
          145deg,
          rgba(8, 39, 22, .97),
          rgba(5, 30, 16, .97)
        );

      border: 1px solid var(--border);

      box-shadow: var(--shadow);
    }

    .header-title {
      font-size: 16px;
      font-weight: 800;
    }

    .header-subtitle {
      margin-top: 4px;

      color: var(--muted);

      font-size: 11px;
    }

    .transaction-total {
      flex-shrink: 0;

      min-width: 85px;

      padding: 8px 13px;

      text-align: center;

      border-radius: 10px;

      border: 1px solid rgba(16, 185, 129, .20);

      background: rgba(16, 185, 129, .07);
    }

    .transaction-total span {
      display: block;

      color: var(--muted);

      font-size: 9px;

      text-transform: uppercase;

      letter-spacing: .6px;
    }

    .transaction-total strong {
      display: block;

      margin-top: 3px;

      color: var(--green-light);

      font-size: 16px;
    }

    /* =========================
       TRANSACTION LIST
    ========================= */

    .transactions-list {
      display: flex;

      flex-direction: column;

      gap: 14px;
    }

    /* =========================
       TRANSACTION CARD
    ========================= */

    .transaction-card {
      position: relative;

      overflow: hidden;

      padding: 20px;

      border-radius: 17px;

      background:
        linear-gradient(
          145deg,
          rgba(8, 39, 22, .98),
          rgba(5, 30, 16, .98)
        );

      border: 1px solid var(--border);

      box-shadow: var(--shadow);

      transition:
        transform .18s ease,
        border-color .18s ease,
        background .18s ease;
    }

    .transaction-card:hover {
      transform: translateY(-2px);

      border-color: rgba(212, 163, 23, .38);

      background:
        linear-gradient(
          145deg,
          rgba(11, 50, 29, .98),
          rgba(5, 30, 16, .98)
        );
    }

    /* =========================
       STATUS ÉPINGLÉ
    ========================= */

    .transaction-status {
      position: absolute;

      top: 18px;
      right: 18px;
    }

    .status {
      display: inline-flex;

      align-items: center;
      justify-content: center;

      min-width: 92px;

      padding: 7px 11px;

      border-radius: 999px;

      font-size: 9px;
      font-weight: 800;

      letter-spacing: .5px;

      text-transform: uppercase;

      white-space: nowrap;
    }

    .status-success {
      color: #5ee39b;

      background: rgba(34, 197, 94, .10);

      border: 1px solid rgba(34, 197, 94, .24);
    }

    .status-pending {
      color: #fbbf24;

      background: rgba(245, 158, 11, .10);

      border: 1px solid rgba(245, 158, 11, .24);
    }

    .status-danger {
      color: #f87171;

      background: rgba(239, 68, 68, .10);

      border: 1px solid rgba(239, 68, 68, .24);
    }

    .status-neutral {
      color: #b6c4bc;

      background: rgba(148, 163, 184, .08);

      border: 1px solid rgba(148, 163, 184, .18);
    }

    /* =========================
       TRANSACTION TOP
    ========================= */

    .transaction-top {
      display: flex;

      align-items: flex-start;
      justify-content: space-between;

      gap: 20px;

      padding-right: 115px;

      margin-bottom: 18px;
    }

    .transaction-type {
      color: var(--text);

      font-size: 16px;

      font-weight: 800;
    }

    .transaction-code {
      display: inline-block;

      margin-top: 7px;

      padding: 6px 9px;

      border-radius: 8px;

      background: rgba(212, 163, 23, .07);

      border: 1px solid rgba(212, 163, 23, .16);

      color: var(--gold-light);

      font-size: 10px;

      font-weight: 800;

      letter-spacing: .2px;

      word-break: break-all;
    }

    .transaction-amount {
      color: var(--green-light);

      font-size: 19px;

      font-weight: 800;

      white-space: nowrap;
    }

    .transaction-amount.negative {
      color: #f87171;
    }

    .transaction-amount.neutral {
      color: var(--text);
    }

    /* =========================
       DETAILS TABLEAU
    ========================= */

    .details-table {
      width: 100%;

      overflow: hidden;

      border-radius: 11px;

      border: 1px solid var(--border-light);

      background: rgba(0, 0, 0, .10);
    }

    .detail-row {
      display: grid;

      grid-template-columns: 180px 1fr;

      min-height: 46px;

      border-bottom: 1px solid var(--border-light);
    }

    .detail-row:last-child {
      border-bottom: none;
    }

    .detail-label {
      display: flex;

      align-items: center;

      padding: 11px 13px;

      color: #8fa99a;

      background: rgba(212, 163, 23, .035);

      font-size: 10px;

      font-weight: 800;

      text-transform: uppercase;

      letter-spacing: .5px;
    }

    .detail-value {
      display: flex;

      align-items: center;

      padding: 11px 13px;

      color: #d9e7de;

      font-size: 12px;

      line-height: 1.45;

      word-break: break-word;
    }

    .detail-value.amount-value {
      color: var(--green-light);

      font-weight: 800;
    }

    .detail-value.balance-value {
      font-weight: 600;
    }

    .detail-value.description-value {
      color: #aebfb4;
    }

    /* =========================
       LOADING / EMPTY / ERROR
    ========================= */

    .state-box {
      padding: 65px 25px;

      text-align: center;

      color: var(--muted);

      border-radius: 17px;

      background:
        linear-gradient(
          145deg,
          rgba(8, 39, 22, .97),
          rgba(5, 30, 16, .97)
        );

      border: 1px solid var(--border);

      box-shadow: var(--shadow);
    }

    .spinner {
      width: 28px;
      height: 28px;

      margin: 0 auto 15px;

      border-radius: 50%;

      border: 2px solid rgba(212, 163, 23, .18);

      border-top-color: var(--gold);

      animation: spin .8s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    .state-icon {
      width: 50px;
      height: 50px;

      margin: 0 auto 15px;

      display: flex;
      align-items: center;
      justify-content: center;

      border-radius: 13px;

      border: 1px solid var(--border);

      color: var(--gold);

      font-size: 20px;

      font-weight: 800;
    }

    .state-title {
      color: var(--text);

      font-size: 15px;

      font-weight: 700;
    }

    .state-text {
      max-width: 500px;

      margin: 7px auto 0;

      font-size: 12px;

      line-height: 1.5;
    }

    .retry-btn {
      margin-top: 17px;

      padding: 10px 17px;

      border-radius: 10px;

      border: 1px solid var(--border);

      background: rgba(212, 163, 23, .08);

      color: var(--gold-light);

      font-weight: 700;

      cursor: pointer;
    }

    .retry-btn:hover {
      background: rgba(212, 163, 23, .15);
    }

    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 650px) {

      .topbar {
        height: 64px;

        padding: 0 15px;
      }

      .brand-logo {
        width: 37px;
        height: 37px;
      }

      .brand-name {
        font-size: 17px;
      }

      .container {
        width: calc(100% - 20px);

        padding-top: 25px;
      }

      .transactions-header {
        padding: 14px;
      }

      .header-subtitle {
        max-width: 200px;
      }

      .transaction-card {
        padding: 15px;
      }

      .transaction-status {
        top: 14px;
        right: 14px;
      }

      .status {
        min-width: 78px;

        padding: 6px 8px;

        font-size: 8px;
      }

      .transaction-top {
        display: block;

        padding-right: 90px;
      }

      .transaction-type {
        font-size: 14px;
      }

      .transaction-amount {
        margin-top: 12px;

        font-size: 17px;
      }

      .detail-row {
        grid-template-columns: 115px 1fr;
      }

      .detail-label {
        padding: 10px 9px;

        font-size: 9px;
      }

      .detail-value {
        padding: 10px 9px;

        font-size: 11px;
      }
    }

    @media (max-width: 390px) {

      .transaction-status {
        position: static;

        margin-bottom: 13px;
      }

      .transaction-top {
        padding-right: 0;
      }

      .detail-row {
        grid-template-columns: 105px 1fr;
      }
    }
  </style>
</head>

<body>

  <header class="topbar">

    <a href="dashboard.html" class="brand">

      <img
        src="logo.jpg"
        alt="ROLEX"
        class="brand-logo"
        onerror="this.style.display='none';"
      >

      <span class="brand-name">
        ROLEX
      </span>

    </a>

    <button
      type="button"
      class="back-btn"
      id="backBtn"
      aria-label="Retour"
    >
      ←
    </button>

  </header>


  <main class="container">

    <section class="page-heading">

      <div class="eyebrow">
        ROLEX Finance
      </div>

      <h1>
        Transactions
      </h1>

      <p>
        Consultez l'historique réel de vos opérations.
      </p>

    </section>


    <section class="transactions-header">

      <div>

        <div class="header-title">
          Historique des opérations
        </div>

        <div class="header-subtitle">
          Les transactions sont affichées de la plus récente à la plus ancienne.
        </div>

      </div>

      <div class="transaction-total">

        <span>
          Total
        </span>

        <strong id="transactionCount">
          0
        </strong>

      </div>

    </section>


    <div id="tableState" class="state-box">

      <div class="spinner"></div>

      <div class="state-title">
        Chargement des transactions
      </div>

      <div class="state-text">
        Récupération des données...
      </div>

    </div>


    <section
      id="transactionsList"
      class="transactions-list"
      style="display:none;"
    ></section>

  </main>


  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script src="transactions.js"></script>

</body>
  </html>
