<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>ROLEX — Transactions</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
  >

  <style>
    :root {
      --bg: #03140a;
      --card: #071d11;
      --card-2: #092517;
      --border: rgba(212, 163, 23, 0.18);
      --gold: #d4a317;
      --gold-light: #f1c84b;
      --green: #10b981;
      --green-light: #34d399;
      --red: #ef4444;
      --yellow: #f59e0b;
      --text: #f5f7f6;
      --muted: #8fa49a;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      background:
        radial-gradient(
          circle at top right,
          rgba(16, 185, 129, 0.08),
          transparent 30%
        ),
        var(--bg);
      color: var(--text);
      font-family: "Inter", sans-serif;
    }

    .page {
      width: 100%;
      max-width: 850px;
      margin: 0 auto;
      padding: 25px 16px 40px;
    }

    /* HEADER */

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 25px;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 13px;
    }

    .back-btn {
      width: 42px;
      height: 42px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: var(--card);
      color: var(--gold-light);
      display: flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      font-size: 20px;
      transition: 0.2s;
    }

    .back-btn:hover {
      border-color: var(--gold);
      transform: translateY(-1px);
    }

    .title {
      font-size: 22px;
      font-weight: 800;
      letter-spacing: -0.3px;
    }

    .subtitle {
      margin-top: 4px;
      color: var(--muted);
      font-size: 12px;
    }

    /* TRANSACTIONS */

    .transactions-list {
      display: flex;
      flex-direction: column;
      gap: 13px;
    }

    .transaction {
      position: relative;
      background:
        linear-gradient(
          145deg,
          rgba(255, 255, 255, 0.025),
          rgba(255, 255, 255, 0)
        ),
        var(--card);

      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 18px;
      overflow: hidden;
      transition: 0.2s;
    }

    .transaction:hover {
      border-color: rgba(212, 163, 23, 0.35);
      transform: translateY(-1px);
    }

    /* NOM */

    .transaction-name {
      padding-right: 115px;
      color: var(--text);
      font-size: 15px;
      font-weight: 700;
      line-height: 1.4;
      text-transform: capitalize;
    }

    /* STATUT ÉPINGLÉ */

    .status {
      position: absolute;
      top: 15px;
      right: 15px;

      padding: 6px 10px;
      border-radius: 999px;

      font-size: 10px;
      font-weight: 700;
      white-space: nowrap;

      border: 1px solid transparent;
    }

    .status.success {
      color: var(--green-light);
      background: rgba(16, 185, 129, 0.10);
      border-color: rgba(16, 185, 129, 0.25);
    }

    .status.pending {
      color: var(--yellow);
      background: rgba(245, 158, 11, 0.10);
      border-color: rgba(245, 158, 11, 0.25);
    }

    .status.danger {
      color: #f87171;
      background: rgba(239, 68, 68, 0.10);
      border-color: rgba(239, 68, 68, 0.25);
    }

    .status.neutral {
      color: #cbd5d1;
      background: rgba(148, 163, 184, 0.08);
      border-color: rgba(148, 163, 184, 0.20);
    }

    /* MONTANT */

    .amount {
      margin-top: 18px;
      font-size: 23px;
      font-weight: 800;
      letter-spacing: -0.4px;
    }

    .amount.positive {
      color: var(--green-light);
    }

    .amount.negative {
      color: #f87171;
    }

    .amount.neutral {
      color: var(--text);
    }

    /* DATE */

    .date {
      margin-top: 8px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 500;
    }

    /* CHARGEMENT */

    .loading {
      padding: 35px 20px;
      text-align: center;
      color: var(--muted);
      font-size: 13px;
    }

    /* VIDE */

    .empty {
      padding: 45px 20px;
      text-align: center;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
    }

    .empty-title {
      font-size: 15px;
      font-weight: 700;
      margin-bottom: 6px;
    }

    .empty-text {
      color: var(--muted);
      font-size: 12px;
    }

    /* ERREUR */

    .error {
      padding: 16px;
      border-radius: 12px;
      border: 1px solid rgba(239, 68, 68, 0.25);
      background: rgba(239, 68, 68, 0.08);
      color: #fca5a5;
      font-size: 13px;
      line-height: 1.5;
    }

    /* MOBILE */

    @media (max-width: 480px) {
      .page {
        padding: 18px 12px 30px;
      }

      .title {
        font-size: 20px;
      }

      .transaction {
        padding: 16px;
      }

      .transaction-name {
        font-size: 14px;
        padding-right: 105px;
      }

      .amount {
        font-size: 21px;
      }

      .status {
        top: 13px;
        right: 13px;
        font-size: 9px;
        padding: 5px 8px;
      }
    }
  </style>
</head>

<body>

  <main class="page">

    <header class="header">
      <div class="header-left">

        <a href="dashboard.html" class="back-btn" aria-label="Retour">
          ←
        </a>

        <div>
          <h1 class="title">Transactions</h1>
          <p class="subtitle">Historique de vos transactions</p>
        </div>

      </div>
    </header>

    <section id="transactionsList" class="transactions-list">
      <div class="loading">
        Chargement des transactions...
      </div>
    </section>

  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="transactions.js"></script>

</body>
    </html>
