<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>ROLEX — Mon stock</title>

  <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #03140a;
      color: #fff;
      min-height: 100vh;
    }

    button {
      font-family: inherit;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .header {
      height: 68px;
      background: #051e10;
      border-bottom: 1px solid rgba(212,163,23,.18);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 22px;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .back {
      color: #d4a317;
      display: flex;
      align-items: center;
      gap: 9px;
      font-size: 14px;
      font-weight: 700;
    }

    .logo {
      color: #d4a317;
      font-size: 22px;
      font-weight: 900;
      letter-spacing: 4px;
    }

    .user-name {
      color: #9aa79f;
      font-size: 13px;
      max-width: 180px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .container {
      max-width: 1120px;
      margin: auto;
      padding: 28px 18px 50px;
    }

    .title {
      margin-bottom: 25px;
    }

    .title h1 {
      font-size: 28px;
      margin-bottom: 7px;
    }

    .title p {
      color: #839189;
      font-size: 14px;
    }

    .summary {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 15px;
      margin-bottom: 30px;
    }

    .summary-card {
      background: #071d11;
      border: 1px solid rgba(255,255,255,.07);
      border-radius: 16px;
      padding: 18px;
    }

    .summary-label {
      color: #839189;
      font-size: 13px;
      margin-bottom: 8px;
    }

    .summary-value {
      font-size: 22px;
      font-weight: 800;
    }

    .section-title {
      margin-bottom: 15px;
    }

    .section-title h2 {
      font-size: 20px;
    }

    .investments {
      display: grid;
      grid-template-columns: 1fr;
      gap: 16px;
    }

    .investment {
      background: #071d11;
      border: 1px solid rgba(255,255,255,.07);
      border-radius: 18px;
      overflow: hidden;
    }

    .investment-main {
      display: flex;
      gap: 18px;
      padding: 18px;
    }

    .product-image {
      width: 150px;
      height: 150px;
      flex-shrink: 0;
      border-radius: 14px;
      overflow: hidden;
      background: #0a2616;
      border: 1px solid rgba(212,163,23,.12);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .product-image img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .placeholder {
      color: #d4a317;
      font-size: 32px;
    }

    .investment-content {
      flex: 1;
      min-width: 0;
    }

    .investment-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 15px;
      margin-bottom: 16px;
    }

    .product-name {
      font-size: 19px;
      font-weight: 800;
    }

    .status {
      padding: 6px 10px;
      border-radius: 20px;
      background: rgba(255,255,255,.07);
      color: #c8d0cb;
      font-size: 11px;
      font-weight: 700;
      white-space: nowrap;
    }

    .status.active {
      color: #5ee58a;
      background: rgba(74,222,128,.08);
    }

    .status.completed {
      color: #d4a317;
      background: rgba(212,163,23,.08);
    }

    .details {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 13px;
    }

    .detail {
      min-width: 0;
    }

    .detail-label {
      color: #78867e;
      font-size: 11px;
      margin-bottom: 5px;
    }

    .detail-value {
      font-size: 14px;
      font-weight: 700;
      word-break: break-word;
    }

    .countdown-box {
      margin: 0 18px 18px;
      padding: 16px;
      border-radius: 13px;
      background: rgba(212,163,23,.06);
      border: 1px solid rgba(212,163,23,.13);
    }

    .countdown-label {
      color: #8e9a93;
      font-size: 12px;
      margin-bottom: 8px;
    }

    .countdown {
      color: #d4a317;
      font-size: 20px;
      font-weight: 900;
      letter-spacing: .5px;
    }

    .countdown.finished {
      color: #7e8b84;
    }

    .empty {
      background: #071d11;
      border: 1px solid rgba(255,255,255,.07);
      border-radius: 16px;
      padding: 45px 20px;
      text-align: center;
      color: #829088;
    }

    .loading {
      position: fixed;
      inset: 0;
      background: #03140a;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 3000;
    }

    .loading.hide {
      display: none;
    }

    .loader {
      text-align: center;
      color: #d4a317;
    }

    .loader i {
      font-size: 27px;
      margin-bottom: 12px;
    }

    .loader div {
      color: #9aa79f;
      font-size: 13px;
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 22px;
      transform: translateX(-50%) translateY(20px);
      width: calc(100% - 30px);
      max-width: 450px;
      padding: 15px 17px;
      border-radius: 12px;
      background: #071d11;
      border: 1px solid rgba(248,113,113,.35);
      box-shadow: 0 12px 40px rgba(0,0,0,.4);
      opacity: 0;
      pointer-events: none;
      transition: .25s;
      z-index: 2000;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    .toast-title {
      font-weight: 800;
      margin-bottom: 4px;
    }

    .toast-text {
      color: #a4afa9;
      font-size: 13px;
    }

    @media (max-width: 800px) {

      .header {
        padding: 0 14px;
      }

      .logo {
        font-size: 19px;
      }

      .user-name {
        display: none;
      }

      .container {
        padding: 22px 14px 45px;
      }

      .title h1 {
        font-size: 24px;
      }

      .summary {
        grid-template-columns: 1fr;
      }

      .investment-main {
        display: block;
      }

      .product-image {
        width: 100%;
        height: 190px;
        margin-bottom: 16px;
      }

      .details {
        grid-template-columns: repeat(2, 1fr);
      }

      .investment-top {
        align-items: flex-start;
      }
    }

    @media (max-width: 430px) {

      .details {
        grid-template-columns: 1fr 1fr;
        gap: 12px;
      }

      .product-name {
        font-size: 17px;
      }

      .countdown {
        font-size: 17px;
      }
    }
  </style>
</head>

<body>

  <div class="loading" id="loading">
    <div class="loader">
      <i class="fa-solid fa-circle-notch fa-spin"></i>
      <div>Chargement de votre stock...</div>
    </div>
  </div>

  <header class="header">

    <a href="produits.html" class="back">
      <i class="fa-solid fa-arrow-left"></i>
      Retour
    </a>

    <div class="logo">
      ROLEX
    </div>

    <div class="user-name" id="userName">
      —
    </div>

  </header>

  <main class="container">

    <div class="title">
      <h1>Mon stock</h1>
      <p>Suivez vos produits et leurs prochains revenus.</p>
    </div>

    <div class="summary">

      <div class="summary-card">
        <div class="summary-label">
          Produits détenus
        </div>
        <div class="summary-value" id="totalInvestments">
          —
        </div>
      </div>

      <div class="summary-card">
        <div class="summary-label">
          Montant investi
        </div>
        <div class="summary-value" id="totalInvested">
          —
        </div>
      </div>

      <div class="summary-card">
        <div class="summary-label">
          Revenus générés
        </div>
        <div class="summary-value" id="totalGenerated">
          —
        </div>
      </div>

    </div>

    <div class="section-title">
      <h2>Mes produits</h2>
    </div>

    <div class="investments" id="investments">

      <div class="empty">
        Chargement...
      </div>

    </div>

  </main>

  <div class="toast" id="toast">
    <div class="toast-title" id="toastTitle"></div>
    <div class="toast-text" id="toastText"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="investissements.js"></script>

</body>
</html>
