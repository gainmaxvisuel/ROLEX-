<!DOCTYPE html><html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">  <title>ROLEX — Connexion</title>
  <meta name="theme-color" content="#06150d">  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
  >  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
  >  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>  <style>
    :root {
      --bg:#06150d;
      --card:#0c2417;
      --gold:#d4af37;
      --gold-light:#f0d77a;
      --green:#10b981;
      --white:#fff;
      --muted:#8fa49a;
      --danger:#ef4444;
      --border:rgba(212,175,55,.16);
    }

    * {
      box-sizing:border-box;
      margin:0;
      padding:0;
    }

    body {
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      font-family:"Inter",sans-serif;
      color:var(--white);
      background:
        radial-gradient(
          circle at top right,
          rgba(212,175,55,.10),
          transparent 30%
        ),
        radial-gradient(
          circle at bottom left,
          rgba(16,185,129,.08),
          transparent 30%
        ),
        var(--bg);
      padding:20px;
    }

    .container {
      width:100%;
      max-width:430px;
    }

    .brand {
      text-align:center;
      margin-bottom:25px;
    }

    .logo {
      width:72px;
      height:72px;
      border-radius:18px;
      object-fit:cover;
      border:1px solid rgba(212,175,55,.3);
      margin-bottom:12px;
    }

    .brand-name {
      color:var(--gold-light);
      font-size:28px;
      font-weight:800;
      letter-spacing:4px;
    }

    .brand-subtitle {
      color:var(--muted);
      font-size:12px;
      margin-top:6px;
    }

    .card {
      background:
        linear-gradient(
          145deg,
          rgba(16,45,29,.97),
          rgba(8,28,17,.99)
        );
      border:1px solid var(--border);
      border-radius:22px;
      padding:25px 20px;
      box-shadow:0 20px 60px rgba(0,0,0,.35);
    }

    h1 {
      font-size:23px;
      margin-bottom:7px;
    }

    .description {
      color:var(--muted);
      font-size:13px;
      line-height:1.6;
      margin-bottom:22px;
    }

    .field {
      margin-bottom:16px;
    }

    label {
      display:block;
      color:#d8e2dd;
      font-size:12px;
      font-weight:600;
      margin-bottom:8px;
    }

    .phone-row {
      display:flex;
      gap:8px;
    }

    .country {
      width:105px;
      flex-shrink:0;
      height:50px;
      border-radius:12px;
      border:1px solid rgba(255,255,255,.09);
      background:rgba(0,0,0,.2);
      color:white;
      padding:0 10px;
      outline:none;
      font-family:inherit;
      font-size:13px;
    }

    input[type="tel"],
    input[type="password"] {
      width:100%;
      height:50px;
      border-radius:12px;
      border:1px solid rgba(255,255,255,.09);
      background:rgba(0,0,0,.2);
      color:white;
      outline:none;
      padding:0 14px;
      font-family:inherit;
      font-size:14px;
    }

    input:focus,
    select:focus {
      border-color:rgba(212,175,55,.6);
      box-shadow:0 0 0 3px rgba(212,175,55,.08);
    }

    .password-wrap {
      position:relative;
    }

    .password-wrap input {
      padding-right:48px;
    }

    .toggle-password {
      position:absolute;
      right:0;
      top:0;
      width:48px;
      height:50px;
      border:0;
      background:transparent;
      color:var(--muted);
      cursor:pointer;
    }

    .submit {
      width:100%;
      height:52px;
      border:0;
      border-radius:13px;
      cursor:pointer;
      background:linear-gradient(135deg,var(--gold),#b88d16);
      color:#08130d;
      font-family:inherit;
      font-weight:800;
      font-size:14px;
      margin-top:5px;
    }

    .submit:disabled {
      opacity:.6;
      cursor:not-allowed;
    }

    .message {
      display:none;
      border-radius:12px;
      padding:12px;
      font-size:12px;
      line-height:1.5;
      margin-bottom:16px;
    }

    .message.error {
      display:block;
      background:rgba(239,68,68,.08);
      border:1px solid rgba(239,68,68,.2);
      color:#ffb4b4;
    }

    .links {
      text-align:center;
      margin-top:20px;
      font-size:12px;
      color:var(--muted);
    }

    .links a {
      color:var(--gold-light);
      text-decoration:none;
      font-weight:700;
    }

    .footer {
      text-align:center;
      color:#5f7369;
      font-size:10px;
      margin-top:18px;
    }
  </style></head><body><div class="container">  <div class="brand"><img
  class="logo"
  src="https://placehold.co/144x144/0c2417/d4af37?text=ROLEX"
  alt="ROLEX"
>

<div class="brand-name">
  ROLEX
</div>

<div class="brand-subtitle">
  Espace membre
</div>

  </div>  <div class="card"><h1>
  Connexion
</h1>

<p class="description">
  Connectez-vous à votre compte pour accéder à votre espace personnel.
</p>


<div id="message" class="message"></div>


<form id="loginForm">

  <div class="field">

    <label for="countryCode">
      Pays
    </label>

    <select id="countryCode" class="country">

      <option value="+226">
        🇧🇫 Burkina Faso (+226)
      </option>

      <option value="+225">
        🇨🇮 Côte d'Ivoire (+225)
      </option>

      <option value="+229">
        🇧🇯 Bénin (+229)
      </option>

      <option value="+228">
        🇹🇬 Togo (+228)
      </option>

      <option value="+223">
        🇲🇱 Mali (+223)
      </option>

      <option value="+221">
        🇸🇳 Sénégal (+221)
      </option>

      <option value="+227">
        🇳🇪 Niger (+227)
      </option>

      <option value="+224">
        🇬🇳 Guinée (+224)
      </option>

      <option value="+237">
        🇨🇲 Cameroun (+237)
      </option>

      <option value="+241">
        🇬🇦 Gabon (+241)
      </option>

    </select>

  </div>


  <div class="field">

    <label for="phone">
      Numéro de téléphone
    </label>

    <input
      type="tel"
      id="phone"
      inputmode="numeric"
      autocomplete="tel"
      placeholder="Ex. 0700000000"
      required
    >

  </div>


  <div class="field">

    <label for="password">
      Mot de passe
    </label>

    <div class="password-wrap">

      <input
        type="password"
        id="password"
        autocomplete="current-password"
        placeholder="Votre mot de passe"
        required
      >

      <button
        type="button"
        class="toggle-password"
        id="togglePassword"
        aria-label="Afficher le mot de passe"
      >
        <i class="fa-solid fa-eye"></i>
      </button>

    </div>

  </div>


  <button
    type="submit"
    class="submit"
    id="submitBtn"
  >
    <i class="fa-solid fa-right-to-bracket"></i>
    Se connecter
  </button>

</form>


<div class="links">

  Vous n'avez pas encore de compte ?
  <a href="inscription.html">
    Créer un compte
  </a>

</div>

  </div>  <div class="footer">
    ROLEX — Connexion sécurisée
  </div></div><script>

const SUPABASE_URL =
  "https://cbxjcwjlhvicurpndoyz.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
  "sb_publishable_KUd51SQCl10pIgztFFGq9Q_Jp1YCK6o";


const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY,
    {
      auth: {
        persistSession:false,
        autoRefreshToken:false,
        detectSessionInUrl:false
      }
    }
  );


const loginForm =
  document.getElementById("loginForm");

const countryCode =
  document.getElementById("countryCode");

const phone =
  document.getElementById("phone");

const password =
  document.getElementById("password");

const submitBtn =
  document.getElementById("submitBtn");

const message =
  document.getElementById("message");

const togglePassword =
  document.getElementById("togglePassword");


/*
 * Affichage / masquage du mot de passe
 */

togglePassword.addEventListener(
  "click",
  function() {

    if (password.type === "password") {

      password.type = "text";

      togglePassword.innerHTML =
        '<i class="fa-solid fa-eye-slash"></i>';

    } else {

      password.type = "password";

      togglePassword.innerHTML =
        '<i class="fa-solid fa-eye"></i>';

    }

  }
);


/*
 * Nettoyage du numéro
 */

phone.addEventListener(
  "input",
  function() {

    this.value =
      this.value.replace(/\D/g,"");

  }
);


/*
 * Message d'erreur
 */

function showError(text) {

  message.textContent = text;

  message.className =
    "message error";

}


/*
 * Connexion
 */

loginForm.addEventListener(
  "submit",
  async function(event) {

    event.preventDefault();


    message.className =
      "message";

    message.textContent =
      "";


    const selectedCountry =
      countryCode.value;

    const enteredPhone =
      phone.value.trim();

    const enteredPassword =
      password.value;


    if (!enteredPhone) {

      showError(
        "Veuillez saisir votre numéro de téléphone."
      );

      return;

    }


    if (!enteredPassword) {

      showError(
        "Veuillez saisir votre mot de passe."
      );

      return;

    }


    submitBtn.disabled = true;

    submitBtn.innerHTML =
      '<i class="fa-solid fa-spinner fa-spin"></i> Connexion...';


    try {

      /*
       * IMPORTANT :
       * Aucun SELECT direct sur public.users.
       *
       * L'état d'activation est maintenant renvoyé
       * directement par la fonction login_user().
       */

      const {
        data,
        error
      } =
        await supabaseClient.rpc(
          "login_user",
          {
            p_country_code:selectedCountry,
            p_phone:enteredPhone,
            p_password:enteredPassword
          }
        );


      if (error) {

        console.error(
          "Erreur login:",
          error
        );

        throw new Error(
          error.message ||
          "Identifiants incorrects."
        );

      }


      if (!data || !data.token) {

        throw new Error(
          "Connexion impossible. Réponse invalide du serveur."
        );

      }


      /*
       * Enregistrement de la session
       */

      localStorage.setItem(
        "rolex_session_token",
        data.token
      );


      localStorage.setItem(
        "rolex_user_code",
        data.user_code || ""
      );


      localStorage.setItem(
        "rolex_user_name",
        data.full_name || ""
      );


      /*
       * On conserve le popup Telegram existant
       */

      localStorage.setItem(
        "rolex_show_telegram_popup",
        "1"
      );


      /*
       * REDIRECTION SELON L'ACTIVATION
       *
       * approved = dashboard
       * pending/rejected = activation
       */

      if (
        data.activation_status ===
        "approved"
      ) {

        window.location.replace(
          "dashboard.html"
        );

      } else {

        window.location.replace(
          "activation.html"
        );

      }

    } catch(error) {

      console.error(
        "Erreur de connexion:",
        error
      );


      let errorText =
        error.message ||
        "Impossible de se connecter.";


      /*
       * Messages plus clairs
       */

      if (
        errorText
          .toLowerCase()
          .includes("identifiants")
      ) {

        errorText =
          "Numéro de téléphone ou mot de passe incorrect.";

      }


      showError(errorText);


      submitBtn.disabled = false;

      submitBtn.innerHTML =
        '<i class="fa-solid fa-right-to-bracket"></i> Se connecter';

    }

  }
);

</script></body>
</html>
