<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>ROLEX — Connexion</title>

  <meta name="theme-color" content="#06150d">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
  >

  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
  >

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root {
      --bg: #06150d;
      --card: #0c2417;
      --card-2: #102d1d;
      --gold: #d4af37;
      --gold-light: #f0d77a;
      --green: #10b981;
      --white: #ffffff;
      --muted: #8fa49a;
      --danger: #ef4444;
      --border: rgba(212,175,55,.16);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: "Inter", sans-serif;
      color: var(--white);

      background:
        radial-gradient(
          circle at top right,
          rgba(212,175,55,.10),
          transparent 30%
        ),
        radial-gradient(
          circle at bottom left,
          rgba(16,185,129,.08),
          transparent 30%
        ),
        var(--bg);

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 25px 15px;
    }

    .page {
      width: 100%;
      max-width: 440px;
    }

    .brand {
      text-align: center;
      margin-bottom: 25px;
    }

    .logo {
      width: 72px;
      height: 72px;

      object-fit: cover;

      display: block;

      margin: 0 auto 14px;

      border-radius: 18px;

      border: 1px solid rgba(212,175,55,.30);

      background: #0c2417;

      box-shadow:
        0 10px 35px rgba(0,0,0,.35);
    }

    .brand-name {
      font-size: 28px;
      font-weight: 800;
      letter-spacing: 3px;
      color: var(--gold-light);
    }

    .brand-text {
      margin-top: 7px;
      color: var(--muted);
      font-size: 13px;
    }

    .card {
      background:
        linear-gradient(
          145deg,
          rgba(16,45,29,.96),
          rgba(8,28,17,.98)
        );

      border: 1px solid var(--border);

      border-radius: 22px;

      padding: 28px 23px;

      box-shadow:
        0 20px 60px rgba(0,0,0,.32);
    }

    .card-title {
      font-size: 22px;
      font-weight: 700;
      margin-bottom: 7px;
    }

    .card-subtitle {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.6;
      margin-bottom: 24px;
    }

    .field {
      margin-bottom: 17px;
    }

    label {
      display: block;

      margin-bottom: 8px;

      color: #d8e2dd;

      font-size: 13px;
      font-weight: 600;
    }

    .input-wrap {
      position: relative;
    }

    .input-wrap > i {
      position: absolute;

      left: 14px;
      top: 50%;

      transform: translateY(-50%);

      color: var(--gold);

      font-size: 14px;

      pointer-events: none;
    }

    input,
    select {
      width: 100%;
      height: 50px;

      border: 1px solid rgba(255,255,255,.09);

      border-radius: 12px;

      background: rgba(0,0,0,.20);

      color: var(--white);

      outline: none;

      padding: 0 14px 0 42px;

      font-family: inherit;
      font-size: 14px;

      transition: .2s ease;
    }

    input::placeholder {
      color: #667a70;
    }

    input:focus,
    select:focus {
      border-color: rgba(212,175,55,.60);

      box-shadow:
        0 0 0 3px rgba(212,175,55,.08);
    }

    select {
      appearance: none;
      cursor: pointer;
    }

    select option {
      background: #0c2417;
      color: white;
    }

    .phone-row {
      display: grid;
      grid-template-columns: 145px 1fr;
      gap: 9px;
    }

    .phone-row select {
      padding-left: 39px;
    }

    .password-toggle {
      position: absolute;

      right: 14px;
      top: 50%;

      transform: translateY(-50%);

      color: #7d9188;

      cursor: pointer;

      font-size: 14px;

      background: none;
      border: 0;

      padding: 5px;
    }

    .password-toggle:hover {
      color: var(--gold);
    }

    .message {
      display: none;

      padding: 12px 13px;

      border-radius: 11px;

      font-size: 12px;

      line-height: 1.5;

      margin-bottom: 16px;
    }

    .message.error {
      display: block;

      background: rgba(239,68,68,.08);

      border:
        1px solid rgba(239,68,68,.20);

      color: #ffb4b4;
    }

    .message.success {
      display: block;

      background: rgba(16,185,129,.08);

      border:
        1px solid rgba(16,185,129,.20);

      color: #9af0ce;
    }

    .submit-btn {
      width: 100%;
      height: 52px;

      border: 0;

      border-radius: 13px;

      cursor: pointer;

      background:
        linear-gradient(
          135deg,
          var(--gold),
          #b88d16
        );

      color: #08130d;

      font-family: inherit;

      font-weight: 800;
      font-size: 14px;

      transition: .2s ease;

      box-shadow:
        0 10px 25px rgba(212,175,55,.13);
    }

    .submit-btn:hover {
      transform: translateY(-1px);

      box-shadow:
        0 13px 30px rgba(212,175,55,.20);
    }

    .submit-btn:disabled {
      opacity: .65;
      cursor: not-allowed;
      transform: none;
    }

    .submit-btn i {
      margin-right: 7px;
    }

    .register-link {
      text-align: center;

      margin-top: 20px;

      color: var(--muted);

      font-size: 13px;
    }

    .register-link a {
      color: var(--gold-light);

      text-decoration: none;

      font-weight: 700;
    }

    .register-link a:hover {
      text-decoration: underline;
    }

    .footer {
      text-align: center;

      color: #5f7369;

      font-size: 10px;

      margin-top: 18px;
    }

    @media (max-width: 430px) {

      .phone-row {
        grid-template-columns: 130px 1fr;
      }

      .card {
        padding: 24px 17px;
      }

      .brand-name {
        font-size: 25px;
      }
    }

    @media (max-width: 350px) {

      .phone-row {
        grid-template-columns: 115px 1fr;
      }

      input,
      select {
        font-size: 13px;
      }
    }
  </style>
</head>

<body>

  <main class="page">

    <div class="brand">

      <img
        class="logo"
        src="https://placehold.co/144x144/0c2417/d4af37?text=ROLEX"
        alt="ROLEX"
      >

      <div class="brand-name">
        ROLEX
      </div>

      <div class="brand-text">
        Accédez à votre compte
      </div>

    </div>


    <section class="card">

      <h1 class="card-title">
        Connexion
      </h1>

      <p class="card-subtitle">
        Connectez-vous avec les informations utilisées lors de votre inscription.
      </p>


      <div id="message" class="message"></div>


      <form id="loginForm" novalidate>


        <div class="field">

          <label for="country">
            Pays
          </label>

          <div class="input-wrap">

            <i class="fa-solid fa-globe"></i>

            <select id="country" required>

              <option value="BF">
                Burkina Faso (+226)
              </option>

              <option value="BJ">
                Bénin (+229)
              </option>

              <option value="TG">
                Togo (+228)
              </option>

              <option value="CI">
                Côte d'Ivoire (+225)
              </option>

            </select>

          </div>

        </div>


        <div class="field">

          <label for="phone">
            Numéro de téléphone
          </label>

          <div class="phone-row">

            <div class="input-wrap">

              <i class="fa-solid fa-phone"></i>

              <select
                id="countryPrefix"
                aria-label="Indicatif téléphonique"
              >

                <option value="+226">
                  +226
                </option>

                <option value="+229">
                  +229
                </option>

                <option value="+228">
                  +228
                </option>

                <option value="+225">
                  +225
                </option>

              </select>

            </div>


            <div class="input-wrap">

              <input
                type="tel"
                id="phone"
                inputmode="numeric"
                autocomplete="tel"
                placeholder="Numéro"
                required
              >

            </div>

          </div>

        </div>


        <div class="field">

          <label for="password">
            Mot de passe
          </label>

          <div class="input-wrap">

            <i class="fa-solid fa-lock"></i>

            <input
              type="password"
              id="password"
              autocomplete="current-password"
              placeholder="Votre mot de passe"
              required
            >

            <button
              type="button"
              class="password-toggle"
              id="passwordToggle"
              aria-label="Afficher le mot de passe"
            >

              <i class="fa-solid fa-eye"></i>

            </button>

          </div>

        </div>


        <button
          type="submit"
          class="submit-btn"
          id="submitBtn"
        >

          <i class="fa-solid fa-right-to-bracket"></i>

          Se connecter

        </button>

      </form>


      <div class="register-link">

        Vous n'avez pas encore de compte ?

        <a href="index.html">
          Créer un compte
        </a>

      </div>

    </section>


    <div class="footer">
      ROLEX
    </div>

  </main>


  <script>

    /*
      Configuration Supabase ROLEX
    */

    const SUPABASE_URL =
      "https://cbxjcwjlhvicurpndoyz.supabase.co";

    const SUPABASE_PUBLISHABLE_KEY =
      "sb_publishable_KUd51SQCl10pIgztFFGq9Q_Jp1YCK6o";


    const supabaseClient =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_PUBLISHABLE_KEY,
        {
          auth: {
            persistSession: false,
            autoRefreshToken: false,
            detectSessionInUrl: false
          }
        }
      );


    const loginForm =
      document.getElementById("loginForm");

    const submitBtn =
      document.getElementById("submitBtn");

    const message =
      document.getElementById("message");

    const country =
      document.getElementById("country");

    const countryPrefix =
      document.getElementById("countryPrefix");

    const phone =
      document.getElementById("phone");

    const password =
      document.getElementById("password");


    const countryPrefixes = {

      BF: "+226",

      BJ: "+229",

      TG: "+228",

      CI: "+225"

    };


    function showMessage(text, type) {

      message.textContent = text;

      message.className =
        "message " + type;

    }


    function clearMessage() {

      message.textContent = "";

      message.className =
        "message";

    }


    /*
      Synchronisation du pays et de l'indicatif.
    */

    country.addEventListener(
      "change",
      function () {

        countryPrefix.value =
          countryPrefixes[this.value];

      }
    );


    /*
      Empêche les caractères non numériques
      dans le numéro.
    */

    phone.addEventListener(
      "input",
      function () {

        this.value =
          this.value.replace(/\D/g, "");

      }
    );


    /*
      Afficher / masquer le mot de passe.
    */

    document
      .getElementById("passwordToggle")
      .addEventListener(
        "click",
        function () {

          const icon =
            this.querySelector("i");

          if (
            password.type === "password"
          ) {

            password.type = "text";

            icon.className =
              "fa-solid fa-eye-slash";

          } else {

            password.type = "password";

            icon.className =
              "fa-solid fa-eye";

          }

        }
      );


    /*
      Connexion ROLEX
    */

    loginForm.addEventListener(
      "submit",
      async function (event) {

        event.preventDefault();

        clearMessage();


        const countryCode =
          country.value;

        const phoneValue =
          phone.value.trim();

        const passwordValue =
          password.value;


        if (!phoneValue) {

          showMessage(
            "Veuillez saisir votre numéro de téléphone.",
            "error"
          );

          return;

        }


        if (!passwordValue) {

          showMessage(
            "Veuillez saisir votre mot de passe.",
            "error"
          );

          return;

        }


        submitBtn.disabled = true;

        submitBtn.innerHTML =
          '<i class="fa-solid fa-spinner fa-spin"></i> Connexion...';


        try {

          /*
            Appel de la fonction PostgreSQL réelle :

            login_user(
              p_country_code,
              p_phone,
              p_password
            )
          */

          const { data, error } =
            await supabaseClient.rpc(
              "login_user",
              {
                p_country_code: countryCode,

                p_phone: phoneValue,

                p_password: passwordValue
              }
            );


          if (error) {

            throw error;

          }


          if (!data || !data.token) {

            throw new Error(
              "La connexion n'a pas retourné de session valide."
            );

          }


          /*
            Session personnalisée ROLEX.

            On ne sauvegarde PAS le mot de passe.

            Le token retourné par PostgreSQL
            est conservé pour les appels futurs.
          */

          localStorage.setItem(
            "rolex_session_token",
            data.token
          );


          /*
            Informations retournées par la base.
            Elles pourront être utilisées par
            dashboard.html.
          */

          localStorage.setItem(
            "rolex_user_code",
            data.user_code || ""
          );


          localStorage.setItem(
            "rolex_user_name",
            data.full_name || ""
          );


          showMessage(
            "Connexion réussie. Ouverture de votre espace...",
            "success"
          );


          /*
            Le dashboard affichera le pop-up Telegram
            à chaque nouvelle connexion.
          */

          setTimeout(function () {

            window.location.href =
              "dashboard.html";

          }, 700);


        } catch (error) {

          console.error(
            "Erreur connexion :",
            error
          );


          let errorMessage =
            "Impossible de vous connecter. Veuillez réessayer.";


          if (
            error &&
            error.message
          ) {

            errorMessage =
              error.message;

          }


          errorMessage =
            errorMessage
              .replace(/^Error:\s*/i, "")
              .trim();


          showMessage(
            errorMessage,
            "error"
          );


          submitBtn.disabled = false;

          submitBtn.innerHTML =
            '<i class="fa-solid fa-right-to-bracket"></i> Se connecter';

        }

      }
    );

  </script>

</body>
                </html>
